<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body { background: #fff; }

/* LOGO */

.logo {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 112px;
    height: 112px;
    transform: translate(-50%, -50%);
    animation: logoDrop 1.4s cubic-bezier(.2,.8,.3,1.3) forwards;
    z-index: 10;
}

.logo svg {
    width: 100%;
    height: 100%;
}

.wave {
    fill: none;
    stroke: #000;
    stroke-width: 5;
    stroke-linecap: round;
    animation: waveLight 2.4s ease-in-out infinite;
}

.wave2 { animation-delay: .25s; }
.wave3 { animation-delay: .5s; }

@keyframes logoDrop {
    0% {
        top: -150px;
        transform: translate(-50%, -50%) rotate(-15deg);
    }
    75% {
        top: 50%;
        transform: translate(-50%, -50%) rotate(5deg);
    }
    100% {
        top: 50%;
        transform: translate(-50%, -50%) rotate(0);
    }
}

@keyframes waveLight {
    0%, 100% { stroke: #000; }
    50% { stroke: #fff; }
}

/* BUTTON */

.surprise-btn {
    position: absolute;
    top: calc(50% + 90px);
    left: 50%;
    transform: translateX(-50%);
    padding: 13px 25px;
    border: none;
    border-radius: 30px;
    background: #111;
    color: white;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.3px;
    white-space: nowrap;
    cursor: pointer;
    z-index: 11;
    animation: buttonAppear .6s ease 1.4s both;
}

@keyframes buttonAppear {
    from {
        opacity: 0;
        transform: translate(-50%, 15px);
    }
    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}

/* TRANSITION */

.wipe-circle {
    position: fixed;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #000;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 20;
    pointer-events: none;
}

.wipe-circle.active {
    animation: wipe 1.5s ease-in-out forwards;
}

@keyframes wipe {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
    }
    65% {
        transform: translate(-50%, -50%) scale(45);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) scale(45);
        opacity: 0;
    }
}

/* LIGHT BACKGROUND */

.scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    z-index: 2;
    background: linear-gradient(
        135deg,
        #fff9f2,
        #f3fff7,
        #f5f3ff,
        #fff3f7,
        #f1faff
    );
    background-size: 300% 300%;
}

.scene.show {
    visibility: visible;
    animation: sceneAppear .8s ease forwards,
               backgroundFlow 16s ease-in-out 1s infinite;
}

@keyframes sceneAppear {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes backgroundFlow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* SOFT LIGHT BLOBS */

.glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(45px);
    opacity: .55;
    pointer-events: none;
}

.glow1 {
    width: 190px;
    height: 190px;
    background: #ffd9c7;
    top: 4%;
    left: -55px;
    animation: glowFloat 9s ease-in-out infinite alternate;
}

.glow2 {
    width: 210px;
    height: 210px;
    background: #d5f5e2;
    right: -65px;
    top: 25%;
    animation: glowFloat 11s ease-in-out infinite alternate-reverse;
}

.glow3 {
    width: 190px;
    height: 190px;
    background: #e2d9ff;
    left: -50px;
    bottom: 5%;
    animation: glowFloat 10s ease-in-out infinite alternate;
}

.glow4 {
    width: 180px;
    height: 180px;
    background: #ffe0ec;
    right: -45px;
    bottom: 2%;
    animation: glowFloat 12s ease-in-out infinite alternate-reverse;
}

@keyframes glowFloat {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(20px, -25px) scale(1.15); }
}

/* PARTICLES */

.particles span {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    box-shadow: 0 0 12px rgba(255,255,255,.8);
    animation: particleFloat 8s ease-in-out infinite alternate;
}

.particles span:nth-child(1) { left: 12%; top: 20%; }
.particles span:nth-child(2) { left: 82%; top: 15%; animation-delay: 1s; }
.particles span:nth-child(3) { left: 20%; top: 75%; animation-delay: 2s; }
.particles span:nth-child(4) { left: 75%; top: 80%; animation-delay: 3s; }
.particles span:nth-child(5) { left: 50%; top: 12%; animation-delay: 1.5s; }
.particles span:nth-child(6) { left: 88%; top: 55%; animation-delay: 2.5s; }

@keyframes particleFloat {
    from { transform: translateY(0); opacity: .3; }
    to { transform: translateY(-25px); opacity: .9; }
}

/* CONNECTING LINE - 2PX */

.connection {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}

.connection-path {
    fill: none;
    stroke: rgba(255,255,255,.95);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 4px rgba(150,160,180,.8));
    stroke-dasharray: 1200;
    stroke-dashoffset: 1200;
}

.connection-path.animate {
    animation: drawLine 7.5s ease-in-out forwards;
}

@keyframes drawLine {
    to { stroke-dashoffset: 0; }
}

/* MOVING LIGHT DOT */

.line-dot {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px 4px rgba(255,255,255,.8);
    z-index: 4;
    opacity: 0;
    pointer-events: none;
}

.line-dot.animate {
    animation: dotTravel 7.5s linear forwards;
}

@keyframes dotTravel {
    0% {
        opacity: 0;
        left: 12%;
        top: 18%;
    }
    5% { opacity: 1; }
    20% { left: 88%; top: 18%; }
    25% { left: 88%; top: 18%; }
    40% { left: 12%; top: 43%; }
    45% { left: 12%; top: 43%; }
    60% { left: 88%; top: 43%; }
    65% { left: 88%; top: 43%; }
    80% { left: 50%; top: 80%; }
    100% {
        left: 50%;
        top: 80%;
        opacity: 0;
    }
}

/* BIGGER MUSIC CARDS */

.photo-card {
    position: absolute;

    width: 40vw;
    max-width: 185px;
    min-width: 140px;

    padding: 8px;
    background: #171717;
    border-radius: 18px;
    box-shadow: 0 14px 32px rgba(0,0,0,.22);
    overflow: hidden;
    z-index: 3;

    opacity: 0;
    visibility: hidden;
    transform: scale(.65);
}

/* PHOTO COVER */

.cover {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 12px;
    background: #333;
}

.cover img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* MUSIC DETAILS */

.music-info {
    padding: 10px 4px 4px;
    color: #fff;
}

.music-title {
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
}

.music-subtitle {
    font-size: 10px;
    color: #aaa;
}

/* PROGRESS BAR */

.progress-area {
    width: 100%;
    height: 3px;
    background: #555;
    border-radius: 10px;
    margin: 10px 0 8px;
    overflow: hidden;
}

.progress-fill {
    width: 35%;
    height: 100%;
    background: #fff;
    border-radius: 10px;
}

/* MUSIC CONTROLS */

.music-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 19px;
    height: 30px;
    color: white;
}

.control {
    font-size: 15px;
    color: #ddd;
    line-height: 1;
}

.play-control {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #fff;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    padding-left: 2px;
}

/* CARD REVEAL */

.photo-card.visible {
    visibility: visible;
    animation:
        cardReveal .8s cubic-bezier(.2,.8,.2,1) forwards,
        photoFloat 5s ease-in-out .8s infinite alternate;
}

@keyframes cardReveal {
    0% {
        opacity: 0;
        scale: .65;
    }
    70% {
        opacity: 1;
        scale: 1.08;
    }
    100% {
        opacity: 1;
        scale: 1;
    }
}

@keyframes photoFloat {
    from { margin-top: 0; }
    to { margin-top: -9px; }
}

/* FIVE CARD POSITIONS */

.card1 {
    top: 4%;
    left: 3%;
    rotate: -7deg;
}

.card2 {
    top: 4%;
    right: 3%;
    rotate: 7deg;
}

.card3 {
    top: 37%;
    left: 1%;
    rotate: -6deg;
}

.card4 {
    top: 37%;
    right: 1%;
    rotate: 7deg;
}

.card5 {
    bottom: 2%;
    left: 50%;
    translate: -50% 0;
    rotate: -3deg;
}

/* SEARCH BAR */

.search-box {
    position: fixed;
    z-index: 8;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 84%;
    max-width: 520px;
    height: 62px;
    padding: 0 17px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #202020;
    border: 1px solid #555;
    border-radius: 17px;
    box-shadow: 0 15px 40px rgba(0,0,0,.24);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.search-box.show {
    visibility: visible;
    animation: searchAppear .8s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes searchAppear {
    from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.65);
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

.search-icon {
    color: #eee;
    font-size: 25px;
    line-height: 1;
}

.typing-text {
    flex: 1;
    min-width: 0;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 15px;
    background: #fff;
    margin-left: 3px;
    vertical-align: middle;
    animation: blink .7s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* SMALL PHONES */

@media (max-width: 380px) {
    .photo-card {
        width: 39vw;
        min-width: 130px;
        padding: 7px;
    }

    .music-title { font-size: 12px; }
    .music-subtitle { font-size: 9px; }
    .music-controls { gap: 15px; }

    .search-box {
        width: 88%;
        height: 58px;
        padding: 0 13px;
    }

    .typing-text { font-size: 11px; }
}

/* long wish lines wrap inside the search bar */
.search-box {
    height: auto;
    min-height: 62px;
    padding-top: 12px;
    padding-bottom: 12px;
}

.typing-text {
    white-space: normal;
    word-break: break-word;
    line-height: 1.35;
}
</style>
</head>
<body>

<!-- HIDDEN YOUTUBE MUSIC PLAYER -->
<div style="position:fixed; left:-10px; top:-10px; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden;">

<script>
let started = false;
let ready = false;
let messages = ["Happy Birthday!"];
let SONG_ID = "";
let ytPlayer = null;
let ytReady = false;

const DEFAULT_TITLES = [
    "Special Moments", "Beautiful Memories", "Happy Times",
    "Golden Moments", "One More Memory"
];

/* LOAD THE WISH DATA */

async function loadWish() {
    const btn = document.getElementById("surpriseBtn");
    try {
        const params = new URLSearchParams(location.search);
        let d = null;

        if (params.get("preview") === "1") {
            d = JSON.parse(localStorage.getItem("wishPreview") || "null");
        } else {
            const id = params.get("id");
            if (!id) throw new Error("no id");
            const snap = await db.collection("wishes").doc(id).get();
            if (!snap.exists) throw new Error("not found");
            d = snap.data();
        }

        if (!d || !d.photos || d.photos.length < 5) throw new Error("bad data");

        for (let i = 0; i < 5; i++) {
            document.getElementById("img" + (i + 1)).src = d.photos[i];
            document.getElementById("t" + (i + 1)).textContent =
                (d.titles && d.titles[i]) || DEFAULT_TITLES[i];
            document.getElementById("s" + (i + 1)).textContent =
                d.name ? "For " + d.name : "Made with love";
        }

        const lines = (d.lines || []).filter(Boolean);
        if (lines.length) messages = lines;

        if (d.songId && /^[\w-]{11}$/.test(d.songId)) {
            SONG_ID = d.songId;
            loadYouTube();
        }

        // wait for the photos to load (max 8 seconds)
        const loads = d.photos.map(src => new Promise(res => {
            const im = new Image();
            im.onload = im.onerror = res;
            im.src = src;
        }));
        await Promise.race([
            Promise.all(loads),
            new Promise(r => setTimeout(r, 8000))
        ]);

        ready = true;
        btn.textContent = "CLICK FOR SURPRISE";
    } catch (e) {
        btn.textContent = "WISH NOT FOUND";
    }
}

loadWish();

/* BACKGROUND MUSIC (YouTube) */

function loadYouTube() {
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
}

function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player("ytPlayer", {
        height: "1",
        width: "1",
        videoId: SONG_ID,
        playerVars: {
            autoplay: 0,
            controls: 0,
            playsinline: 1,
            loop: 1,
            playlist: SONG_ID,
            rel: 0,
            modestbranding: 1
        },
        events: {
            onReady: function () { ytReady = true; }
        }
    });
}

function playMusic(attempt) {
    if (!SONG_ID) return;
    attempt = attempt || 0;

    if (ytPlayer && ytReady) {
        try {
            ytPlayer.setVolume(0);
            ytPlayer.playVideo();

            let vol = 0;
            const fade = setInterval(function () {
                vol += 5;
                ytPlayer.setVolume(vol);
                if (vol >= 60) clearInterval(fade);
            }, 150);
        } catch (e) {}
    } else if (attempt < 20) {
        setTimeout(function () { playMusic(attempt + 1); }, 500);
    }
}

/* WHOOSH SOUND (no file needed) */

function playWhoosh() {
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;

        const ctx = new AC();
        if (ctx.state === "suspended") ctx.resume();

        const now = ctx.currentTime;
        const dur = 1.4;

        const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.value = 1.2;
        filter.frequency.setValueAtTime(300, now);
        filter.frequency.exponentialRampToValueAtTime(3500, now + 0.7);
        filter.frequency.exponentialRampToValueAtTime(400, now + dur);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.0001, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.5, now + 0.5);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(now);

        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.9);

        const oscGain = ctx.createGain();
        oscGain.gain.setValueAtTime(0.0001, now);
        oscGain.gain.exponentialRampToValueAtTime(0.35, now + 0.12);
        oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.95);

        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1);

        setTimeout(() => ctx.close(), 2000);
    } catch (e) {}
}

function startWish() {
    if (started || !ready) return;
    started = true;

    const button = document.getElementById("surpriseBtn");
    const logo = document.getElementById("logo");
    const wipe = document.getElementById("wipeCircle");
    const scene = document.getElementById("scene");
    const searchBox = document.getElementById("searchBox");

    button.style.display = "none";

    playMusic();
    playWhoosh();

    logo.style.animation = "none";
    logo.style.zIndex = "30";
    void logo.offsetWidth;

    wipe.classList.add("active");

    logo.style.transition =
        "left 1.1s cubic-bezier(.6,0,.4,1), transform 1.1s cubic-bezier(.6,0,.4,1), opacity .3s ease .8s";
    logo.style.left = "-60px";
    logo.style.transform = "translate(-50%, -50%) scale(.25) rotate(-360deg)";
    logo.style.opacity = "0";

    setTimeout(() => {
        scene.classList.add("show");
    }, 700);

    setTimeout(() => {
        document.getElementById("card1").classList.add("visible");
    }, 1300);

    setTimeout(() => {
        document.getElementById("connectionPath").classList.add("animate");
        document.getElementById("lineDot").classList.add("animate");
    }, 1900);

    const revealTimes = [3000, 4500, 6000, 7500];

    revealTimes.forEach((time, index) => {
        setTimeout(() => {
            document.getElementById("card" + (index + 2))
                .classList.add("visible");
        }, time);
    });

    setTimeout(() => {
        searchBox.classList.add("show");
    }, 8600);

    setTimeout(() => {
        startTyping();
    }, 9400);
}

/* TYPEWRITER EFFECT */

let messageIndex = 0;
let charIndex = 0;
let deleting = false;

function startTyping() {
    const typingText = document.getElementById("typingText");
    const currentMessage = messages[messageIndex];

    if (!deleting) {
        typingText.textContent =
            currentMessage.substring(0, charIndex + 1);

        charIndex++;

        if (charIndex >= currentMessage.length) {
            deleting = true;
            setTimeout(startTyping, 1700);
            return;
        }

        setTimeout(startTyping, 85);
    } else {
        typingText.textContent =
            currentMessage.substring(0, charIndex - 1);

        charIndex--;

        if (charIndex <= 0) {
            deleting = false;
            messageIndex = (messageIndex + 1) % messages.length;
            setTimeout(startTyping, 500);
            return;
        }

        setTimeout(startTyping, 45);
    }
}
