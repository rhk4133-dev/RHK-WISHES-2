<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - RHK WISHES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b0b12;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
body::before,body::after{content:"";position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(90px);pointer-events:none}
body::before{background:#ff3d81;top:60px;left:-80px;opacity:.5}
body::after{background:#5b3dff;bottom:60px;right:-90px;opacity:.5}
.box{position:relative;z-index:1;width:100%;max-width:380px;padding:26px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
h1{text-align:center;font-size:24px;letter-spacing:1px;margin-bottom:4px}
p.sub{text-align:center;opacity:.7;font-size:14px;margin-bottom:20px}
input,button{width:100%;padding:12px;margin-bottom:12px;border-radius:10px;font-size:16px}
input{border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff}
input::placeholder{color:rgba(255,255,255,.55)}
button{border:none;font-weight:bold;color:#fff;background:#ff3d81}
button.alt{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3)}
button.google{background:#fff;color:#222}
.or{text-align:center;opacity:.6;font-size:13px;margin:4px 0 12px}
#msg{text-align:center;font-size:14px;color:#ffb3c6;min-height:18px}
a{color:#fff;display:block;text-align:center;font-size:14px;opacity:.7;margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <h1>RHK WISHES</h1>
  <p class="sub">Login to continue</p>

  <input id="name" type="text" placeholder="Name (only for Sign up)">
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password (min 6 characters)">

  <button id="login">Login</button>
  <button id="signup" class="alt">Create account</button>
  <div class="or">or</div>
  <button id="google" class="google">Continue with Google</button>

  <div id="msg"></div>
  <a href="index.html">Back to home</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBND3n2ag9qGZG5SJPOKNVYr2dHNLwoD7Y",
  authDomain: "rhk-music-24bbc.firebaseapp.com",
  databaseURL: "https://rhk-music-24bbc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "rhk-music-24bbc",
  storageBucket: "rhk-music-24bbc.firebasestorage.app",
  messagingSenderId: "571438674805",
  appId: "1:571438674805:web:bcfe7856316b638d08193c",
  measurementId: "G-RF4GEDGP9N"
};

const auth = getAuth(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const go = () => { location.href = "index.html"; };

onAuthStateChanged(auth, user => { if(user) go(); });

function showError(err){
  const map = {
    "auth/invalid-credential":"Wrong email or password",
    "auth/invalid-email":"Invalid email",
    "auth/email-already-in-use":"Email already registered, use Login",
    "auth/weak-password":"Password must be at least 6 characters",
    "auth/popup-closed-by-user":"Google sign-in cancelled",
    "auth/unauthorized-domain":"Domain not authorized in Firebase",
    "auth/operation-not-allowed":"This login method is not enabled in Firebase"
  };
  $("msg").textContent = map[err.code] || err.message;
}

$("login").onclick = async () => {
  const email = $("email").value.trim(), pass = $("pass").value;
  if(!email || !pass){ $("msg").textContent = "Enter email and password"; return; }
  try{
    $("msg").textContent = "Please wait...";
    await signInWithEmailAndPassword(auth, email, pass);
    go();
  }catch(e){ showError(e); }
};

$("signup").onclick = async () => {
  const name = $("name").value.trim(), email = $("email").value.trim(), pass = $("pass").value;
  if(!email || !pass){ $("msg").textContent = "Enter email and password"; return; }
  try{
    $("msg").textContent = "Please wait...";
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    if(name) await updateProfile(cred.user, { displayName: name });
    go();
  }catch(e){ showError(e); }
};

$("google").onclick = async () => {
  try{
    await signInWithPopup(auth, new GoogleAuthProvider());
    go();
  }catch(e){ showError(e); }
};
</script>
</body>
</html>
