<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b0b12;color:#fff;padding:20px}
h2{margin:6px 0 16px}
hr{border:none;border-top:1px solid #333;margin:26px 0}
input,button{width:100%;padding:12px;margin-bottom:12px;border-radius:10px;border:1px solid #444;background:#1a1a26;color:#fff;font-size:16px}
button{background:#ff3d81;border:none;font-weight:bold}
img{max-width:100%;border-radius:12px;margin-bottom:12px}
.status{opacity:.8;margin-bottom:6px}
</style>
</head>
<body>

<h2>Add Template</h2>
<input id="n" type="number" placeholder="Template number (1 = birthday1.html)">
<input id="name" type="text" placeholder="Template name">
<input id="file" type="file" accept="image/*">
<img id="preview" style="display:none">
<button id="save">Save Template</button>
<div id="status" class="status"></div>

<hr>

<h2>Home Background</h2>
<input id="bgfile" type="file" accept="image/*">
<img id="bgpreview" style="display:none">
<button id="bgsave">Save Background</button>
<div id="bgstatus" class="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBND3n2ag9qGZG5SJPOKNVYr2dHNLwoD7Y",
  authDomain: "rhk-music-24bbc.firebaseapp.com",
  databaseURL: "https://rhk-music-24bbc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "rhk-music-24bbc",
  storageBucket: "rhk-music-24bbc.firebasestorage.app",
  messagingSenderId: "571438674805",
  appId: "1:571438674805:web:bcfe7856316b638d08193c",
  measurementId: "G-RF4GEDGP9N"
};
const CLOUD_NAME = "nhy9lfkt";
const UPLOAD_PRESET = "rhk_upload";

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);

async function upload(file){
  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {method:"POST", body:fd});
  const data = await res.json();
  if(!data.secure_url) throw new Error("Upload failed");
  return data.secure_url;
}

function preview(inputId, imgId){
  $(inputId).onchange = e => {
    const f = e.target.files[0];
    if(f){ $(imgId).src = URL.createObjectURL(f); $(imgId).style.display = "block"; }
  };
}
preview("file","preview");
preview("bgfile","bgpreview");

$("save").onclick = async () => {
  const n = parseInt($("n").value);
  const name = $("name").value.trim();
  const file = $("file").files[0];
  if(!n || !name || !file){ $("status").textContent = "Fill all fields"; return; }
  try{
    $("status").textContent = "Uploading image...";
    const image = await upload(file);
    $("status").textContent = "Saving...";
    await setDoc(doc(db,"templates","birthday"+n), { n, name, image, createdAt: serverTimestamp() });
    $("status").textContent = "Saved! birthday" + n + ".html added to home.";
  }catch(err){
    $("status").textContent = "Error: " + err.message;
  }
};

$("bgsave").onclick = async () => {
  const file = $("bgfile").files[0];
  if(!file){ $("bgstatus").textContent = "Choose an image"; return; }
  try{
    $("bgstatus").textContent = "Uploading image...";
    const bgImage = await upload(file);
    $("bgstatus").textContent = "Saving...";
    await setDoc(doc(db,"settings","home"), { bgImage, updatedAt: serverTimestamp() });
    $("bgstatus").textContent = "Background updated!";
  }catch(err){
    $("bgstatus").textContent = "Error: " + err.message;
  }
};
</script>
</body>
</html>
