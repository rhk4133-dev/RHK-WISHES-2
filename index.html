<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RHK WISHES - Birthday Wish Templates</title>
<meta name="description" content="RHK WISHES: create beautiful birthday wish pages and send them to your loved ones. Free birthday templates.">
<meta name="google-site-verification" content="0vnZFZ154D1f55L_hxSQ496_-ElRPEg7fwjvXndFCXY" />
<link rel="canonical" href="https://rhk4133-dev.github.io/RHK-WISHES-2/">
<meta property="og:title" content="RHK WISHES">
<meta property="og:description" content="Create beautiful birthday wish pages for your loved ones.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rhk4133-dev.github.io/RHK-WISHES-2/">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b0b12;color:#fff;min-height:100vh;overflow-x:hidden;position:relative}
body::before,body::after{content:"";position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
body::before{background:#ff3d81;top:80px;left:-80px;opacity:.4}
body::after{background:#5b3dff;top:360px;right:-90px;opacity:.4}
.wrap{position:relative;z-index:1;padding:0 18px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 14px;border-bottom:1px solid rgba(255,255,255,.25);position:relative}
.brand{font-size:22px;font-weight:bold;letter-spacing:1px;margin:0}
.tag{margin-top:14px;font-size:14px;opacity:.75;line-height:1.5}
.profile{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;font-weight:bold;font-size:17px}
.profile img{width:100%;height:100%;object-fit:cover}
.profile svg{width:22px;height:22px;fill:#fff}
.pmenu{display:none;position:absolute;right:0;top:66px;width:230px;padding:16px;z-index:10;text-align:center;background:rgba(30,30,45,.85)}
.pmenu.show{display:block}
.pmenu .av{width:60px;height:60px;border-radius:50%;margin:0 auto 10px;background:#ff3d81;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;overflow:hidden}
.pmenu .av img{width:100%;height:100%;object-fit:cover}
.pmenu .nm{font-weight:bold;font-size:16px;word-break:break-word}
.pmenu .em{font-size:13px;opacity:.7;margin:4px 0 14px;word-break:break-all}
.pmenu button{width:100%;padding:10px;border:none;border-radius:10px;background:#ff3d81;color:#fff;font-weight:bold;font-size:15px}
h2{margin:22px 0 12px;font-size:20px}
.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.35);overflow:hidden}
a{color:inherit;text-decoration:none}
#trending{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#trending::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;display:block}
.slide img{width:100%;height:200px;object-fit:cover;display:block}
.slide .info{padding:14px 16px;font-size:18px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card img{width:100%;height:130px;object-fit:cover;display:block}
.card .info{padding:10px 12px;font-size:15px}
.msg{opacity:.7;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">RHK WISHES</h1>
    <div class="profile" id="profileBtn"></div>
    <div class="glass pmenu" id="pmenu"></div>
  </header>

  <p class="tag">Create beautiful birthday wish pages for your loved ones. Choose a birthday template, add your photos and message, and send your wish.</p>

  <h2>Trending</h2>
  <div id="trending" class="glass"><div class="msg" style="padding:16px">Loading...</div></div>

  <h2>Birthday Templates</h2>
  <div id="list" class="grid"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, getDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBND3n2ag9qGZG5SJPOKNVYr2dHNLwoD7Y",
  authDomain: "rhk-music-24bbc.firebaseapp.com",
  databaseURL: "https://rhk-music-24bbc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "rhk-music-24bbc",
  storageBucket: "rhk-music-24bbc.firebasestorage.app",
  messagingSenderId: "571438674805",
  appId: "1:571438674805:web:bcfe7856316b638d08193c",
  measurementId: "G-RF4GEDGP9N"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ---------- Profile ---------- */
const btn = document.getElementById("profileBtn");
const menu = document.getElementById("pmenu");
const personSvg = '<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/></svg>';
let currentUser = null;

onAuthStateChanged(auth, user => {
  currentUser = user;
  if(user){
    const name = user.displayName || user.email.split("@")[0];
    const initial = name.charAt(0).toUpperCase();
    btn.innerHTML = user.photoURL ? `<img src="${user.photoURL}">` : initial;
    menu.innerHTML = `
      <div class="av">${user.photoURL ? `<img src="${user.photoURL}">` : initial}</div>
      <div class="nm">${name}</div>
      <div class="em">${user.email || ""}</div>
      <button id="logout">Logout</button>`;
    document.getElementById("logout").onclick = async () => {
      await signOut(auth);
      menu.classList.remove("show");
    };
  }else{
    btn.innerHTML = personSvg;
    menu.innerHTML = "";
  }
});

btn.onclick = e => {
  e.stopPropagation();
  if(!currentUser){ location.href = "login.html"; return; }
  menu.classList.toggle("show");
};
document.addEventListener("click", e => {
  if(!menu.contains(e.target)) menu.classList.remove("show");
});

/* ---------- Background ---------- */
async function loadBackground(){
  try{
    const s = await getDoc(doc(db,"settings","home"));
    if(s.exists() && s.data().bgImage){
      document.body.style.background =
        `linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)), url("${s.data().bgImage}") center/cover fixed no-repeat`;
    }
  }catch(e){}
}

/* ---------- Templates ---------- */
async function loadTemplates(){
  const t = document.getElementById("trending");
  const l = document.getElementById("list");
  try{
    const snap = await getDocs(query(collection(db,"templates"), orderBy("n","desc")));
    const items = snap.docs.map(d => d.data());
    if(!items.length){
      t.innerHTML = '<div class="msg" style="padding:16px">No templates yet</div>';
      return;
    }

    const latest = items.slice(0,4);
    t.innerHTML = latest.map(i => `
      <a class="slide" href="birthday${i.n}.html">
        <img src="${i.image}" alt="${i.name}"><div class="info">${i.name}</div>
      </a>`).join("");

    if(latest.length > 1){
      let idx = 0;
      t.addEventListener("scroll", () => {
        idx = Math.round(t.scrollLeft / t.clientWidth);
      });
      setInterval(() => {
        idx = (idx + 1) % latest.length;
        t.scrollTo({left: idx * t.clientWidth, behavior:"smooth"});
      }, 2000);
    }

    l.innerHTML = items.map(i => `
      <a class="glass card" href="birthday${i.n}.html">
        <img src="${i.image}" alt="${i.name}"><div class="info">${i.name}</div>
      </a>`).join("");
  }catch(e){
    t.innerHTML = '<div class="msg" style="padding:16px">Could not load templates</div>';
  }
}

loadBackground();
loadTemplates();
</script>
</body>
</html>
